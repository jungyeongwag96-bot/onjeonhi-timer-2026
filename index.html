<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#281044"><meta name="description" content="온전히 타이머 — 인터벌 운동과 큐브 연습을 위한 무료 PWA 타이머"><link rel="manifest" href="manifest.webmanifest"><link rel="icon" href="assets/icon.svg" type="image/svg+xml"><link rel="stylesheet" href="styles.css"><title>온전히 · 타이머</title></head>
<body><main class="app"><header class="top"><div class="brand"><span class="brand-dot"></span>온전히 <span class="muted">· 타이머</span></div><div class="top-actions"><span class="header-caption">움직임에 온전히 집중하는 시간</span><span id="installHint" class="tiny">● 오프라인 지원</span><button class="outline small" id="installBtn" hidden>앱 설치</button></div></header>
<nav class="tabs" aria-label="타이머 유형"><button id="intervalTab" class="tab active" aria-selected="true">인터벌 타이머</button><button id="stopwatchTab" class="tab" aria-selected="false">스톱워치</button></nav>
<section id="intervalPage" class="page"><div class="timer-layout"><section class="stage"><div class="stage-top"><span id="status" class="pill">준비 완료</span><span id="roundLabel" class="round-label">라운드 1 / 8</span></div><div class="clock-wrap"><div class="eyebrow">FOCUS ON YOUR MOMENT</div><p id="phaseText" class="phase">운동 준비</p><div id="clock" class="clock" aria-live="off">00:30</div><p id="nextText" class="next">시작 버튼을 누르세요</p></div><div class="progress"><div id="progressFill"></div></div><div class="controls"><button id="startBtn" class="primary">시작</button><button id="resetBtn" class="outline">초기화</button><button id="fullscreenBtn" class="outline">전체화면</button></div></section>
<aside class="settings"><div class="side-head"><h2>⚙ 라운드 설정</h2><span class="tiny">자동 저장</span></div><div class="form-grid"><label>라운드 이름<input id="roundName" maxlength="35" value="운동"></label><label>라운드 수<input id="rounds" type="number" min="1" max="99" value="8"></label><label>운동 시간 (초)<input id="work" type="number" min="1" max="3600" value="30"></label><label>휴식 시간 (초)<input id="rest" type="number" min="0" max="3600" value="10"></label><label>준비 시간 (초)<input id="prepare" type="number" min="0" max="3600" value="5"></label><label>소리 크기 <output id="volumeLabel">80%</output><input id="volume" type="range" min="0" max="100" value="80"></label><label>시작 알림<select id="startSound"><option value="bell">복싱벨</option><option value="whistle">휘슬</option><option value="horn">응원 나팔</option><option value="beep">기본음</option><option value="none">없음</option></select></label><label>종료 알림<select id="endSound"><option value="whistle">휘슬</option><option value="bell">복싱벨</option><option value="horn">응원 나팔</option><option value="beep">기본음</option><option value="none">없음</option></select></label></div><label class="check"><input id="voice" type="checkbox" checked> 라운드 번호 음성 안내 (지원 브라우저에서만)</label><div class="sound-test"><button class="outline small" id="testSound">알림음 테스트</button><span class="tiny">브라우저 생성 사운드</span></div><hr><div class="side-head"><h2>▣ 나의 템플릿</h2><span class="tiny" id="templateCount">0개 저장됨</span></div><div class="template-line"><select id="templateSelect" aria-label="저장된 템플릿"></select><button class="outline small" id="loadTemplate">불러오기</button></div><div class="template-line"><input id="templateName" maxlength="35" placeholder="템플릿 이름"><button class="primary small" id="saveTemplate">저장</button><button class="outline small" id="deleteTemplate">삭제</button></div><p class="tiny note">이 브라우저에만 저장됩니다. 서버 계정·동기화는 아직 지원하지 않습니다.</p></aside></div></section>
<section id="stopwatchPage" class="page" hidden><section class="stopwatch-stage"><div class="stage-top"><span class="pill" id="swStatus">대기 중</span><span>큐브 · 운동 기록</span></div><p class="sw-heading">나의 기록에 집중하세요</p><div class="sw-clock" id="swClock" aria-live="off">00:00.00</div><div class="controls"><button class="primary" id="swStart">시작</button><button class="outline" id="swLap">랩 기록</button><button class="outline" id="swReset">초기화</button></div><div class="laps-head"><h2>기록 <span id="lapCount">0</span></h2><button class="outline small" id="exportLaps">CSV 저장</button></div><ol id="laps" class="laps"></ol></section></section>
<footer>온전히 · 타이머 <span>운동의 시작부터 마지막까지 · 독립형 PWA</span></footer></main><div id="toast" class="toast" role="status" aria-live="polite"></div><script src="app.js" defer></script></body></html>
